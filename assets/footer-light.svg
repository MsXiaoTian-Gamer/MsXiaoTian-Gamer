  <text x="600" y="65" text-anchor="middle" fill="#5b21b6" font-family="monospace" font-size="21" letter-spacing="3">THANKS FOR PLAYING</text>
  <text x="600" y="102" text-anchor="middle" fill="#706080" font-family="Segoe UI,Arial,sans-serif" font-size="16">See you in the next world.</text>
